<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصحف الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dark: #8a6d1e;
    --bg: #0d1117;
    --bg2: #141a24;
    --bg3: #1c2535;
    --bg4: #243044;
    --text: #f0e6cc;
    --text-muted: #8899aa;
    --border: #2a3a55;
    --green: #4caf72;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }

  .header {
    background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
    border-bottom: 1px solid var(--gold-dark);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--gold-dark), var(--gold)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .logo-text { font-size: 20px; font-weight: 700; color: var(--gold); }
  .logo-sub { font-size: 11px; color: var(--text-muted); }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
  .btn-gold { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #0d1117; }
  .btn-gold:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-outline:hover { border-color: var(--gold-dark); color: var(--gold); }

  .app { display: flex; height: calc(100vh - 71px); }

  .sidebar { width: 300px; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 14px; border-bottom: 1px solid var(--border); }
  .search-box { position: relative; }
  .search-box input { width: 100%; padding: 9px 38px 9px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Cairo', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .search-box input:focus { border-color: var(--gold-dark); }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; }
  .sura-list { flex: 1; overflow-y: auto; padding: 8px; }
  .sura-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; transition: all 0.2s; margin-bottom: 2px; border: 1px solid transparent; }
  .sura-item:hover { background: var(--bg3); }
  .sura-item.active { background: linear-gradient(135deg, rgba(201,168,76,0.12), rgba(138,109,30,0.08)); border-color: rgba(201,168,76,0.25); }
  .sura-num { width: 34px; height: 34px; background: linear-gradient(135deg, var(--bg3), var(--bg4)); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--gold); font-weight: 700; flex-shrink: 0; }
  .sura-item.active .sura-num { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #0d1117; border-color: transparent; }
  .sura-info { flex: 1; min-width: 0; }
  .sura-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .sura-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .sura-type { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: var(--bg4); color: var(--text-muted); flex-shrink: 0; }
  .sura-item.active .sura-type { background: rgba(201,168,76,0.18); color: var(--gold); }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .surah-header { padding: 22px 28px 18px; background: linear-gradient(180deg, var(--bg2) 0%, transparent 100%); border-bottom: 1px solid var(--border); text-align: center; }
  .surah-title { font-size: 34px; font-family: 'Amiri', serif; color: var(--gold); margin-bottom: 4px; }
  .surah-subtitle { font-size: 13px; color: var(--text-muted); }
  .basmala { font-family: 'Amiri', serif; font-size: 24px; color: var(--text); margin-top: 14px; text-align: center; }
  .surah-info-bar { display: flex; justify-content: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .info-badge { display: flex; align-items: center; gap: 5px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text-muted); }
  .info-badge span { color: var(--gold); font-weight: 600; }

  .audio-upload-bar { padding: 8px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
  .upload-label-global { display: flex; align-items: center; gap: 5px; background: var(--bg3); border: 1px dashed var(--border); border-radius: 8px; padding: 5px 12px; cursor: pointer; transition: all 0.2s; color: var(--text-muted); font-size: 12px; }
  .upload-label-global:hover { border-color: var(--gold-dark); color: var(--gold); }
  .upload-label-global input { display: none; }

  .ayat-container { flex: 1; overflow-y: auto; padding: 20px 28px; }

  .loading { display: flex; align-items: center; justify-content: center; height: 200px; flex-direction: column; gap: 14px; color: var(--text-muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ayah-card { display: flex; gap: 14px; padding: 18px; border-radius: 12px; border: 1px solid transparent; margin-bottom: 10px; transition: all 0.2s; background: var(--bg2); }
  .ayah-card:hover { border-color: var(--border); background: var(--bg3); }
  .ayah-card.playing { border-color: var(--gold-dark); background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(138,109,30,0.05)); }
  .ayah-num { width: 36px; height: 36px; background: linear-gradient(135deg, var(--bg3), var(--bg4)); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--gold); font-weight: 700; flex-shrink: 0; margin-top: 4px; }
  .ayah-content { flex: 1; }
  .ayah-text { font-family: 'Amiri', serif; font-size: 23px; line-height: 2.1; color: var(--text); text-align: right; margin-bottom: 12px; }
  .ayah-actions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

  .play-btn { display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg4); color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'Cairo', sans-serif; font-weight: 600; }
  .play-btn:hover { border-color: var(--gold-dark); color: var(--gold); background: rgba(201,168,76,0.1); }
  .play-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.14); }

  .upload-ayah-btn { display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 20px; border: 1px dashed var(--border); background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'Cairo', sans-serif; position: relative; }
  .upload-ayah-btn:hover { border-color: var(--green); color: var(--green); }
  .upload-ayah-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-ayah-btn.has-audio { border-color: var(--green); color: var(--green); }

  .bookmark-btn { display: flex; align-items: center; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .bookmark-btn:hover { border-color: var(--gold-dark); color: var(--gold); }
  .bookmark-btn.saved { color: var(--gold); border-color: var(--gold-dark); background: rgba(201,168,76,0.08); }

  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; gap: 18px; }
  .welcome-icon { font-size: 70px; margin-bottom: 6px; }
  .welcome-title { font-size: 30px; font-family: 'Amiri', serif; color: var(--gold); }
  .welcome-desc { font-size: 14px; color: var(--text-muted); line-height: 1.9; max-width: 420px; }
  .welcome-stats { display: flex; gap: 16px; margin-top: 8px; }
  .stat-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 22px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--gold); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .now-playing { background: linear-gradient(135deg, var(--bg3), var(--bg4)); border-top: 1px solid var(--gold-dark); padding: 10px 20px; display: none; align-items: center; gap: 14px; }
  .now-playing.visible { display: flex; }
  .np-info { flex: 1; min-width: 0; }
  .np-title { font-size: 13px; color: var(--gold); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-subtitle { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-controls { display: flex; align-items: center; gap: 10px; }
  .np-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 18px; transition: color 0.2s; display: flex; align-items: center; }
  .np-btn:hover { color: var(--gold); }
  .np-btn.main { font-size: 24px; color: var(--gold); }
  .np-progress { flex: 1; height: 4px; background: var(--border); border-radius: 2px; cursor: pointer; position: relative; min-width: 80px; }
  .np-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); border-radius: 2px; width: 0%; transition: width 0.1s; }
  audio { display: none; }

  .bookmarks-panel { display: none; position: fixed; top: 71px; left: 0; width: 280px; height: calc(100vh - 71px); background: var(--bg2); border-right: 1px solid var(--border); z-index: 50; flex-direction: column; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
  .bookmarks-panel.open { display: flex; }
  .bp-header { padding: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .bp-title { font-size: 14px; font-weight: 700; color: var(--gold); }
  .bp-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 17px; }
  .bp-list { flex: 1; overflow-y: auto; padding: 8px; }
  .bp-item { padding: 10px; border-radius: 8px; background: var(--bg3); margin-bottom: 5px; cursor: pointer; transition: background 0.2s; border: 1px solid var(--border); }
  .bp-item:hover { background: var(--bg4); }
  .bp-item-title { font-size: 12px; color: var(--text); font-weight: 600; }
  .bp-item-text { font-family: 'Amiri', serif; font-size: 15px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--gold-dark); color: var(--text); padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 999; font-family: 'Cairo', sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease; white-space: nowrap; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  @media (max-width: 700px) {
    .sidebar { width: 260px; position: fixed; right: 0; top: 71px; height: calc(100vh - 71px); z-index: 40; transform: translateX(100%); transition: transform 0.3s; }
    .sidebar.open { transform: translateX(0); }
    .main { width: 100%; }
    .ayah-text { font-size: 20px; }
    .welcome-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">☽</div>
    <div>
      <div class="logo-text">مصحف الكريم</div>
      <div class="logo-sub">القرآن الكريم كاملاً</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="toggleBookmarks()">🔖 المحفوظات</button>
    <label class="btn btn-gold" style="cursor:pointer">
      🎵 رفع ملفات الصوت
      <input type="file" accept="audio/*" multiple style="display:none" onchange="handleGlobalAudio(event)">
    </label>
  </div>
</header>

<div class="bookmarks-panel" id="bookmarksPanel">
  <div class="bp-header">
    <span class="bp-title">🔖 الآيات المحفوظة</span>
    <button class="bp-close" onclick="toggleBookmarks()">✕</button>
  </div>
  <div class="bp-list" id="bookmarksList"></div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="ابحث عن سورة..." oninput="filterSuras()">
      </div>
    </div>
    <div class="sura-list" id="suraList"></div>
  </aside>

  <main class="main" id="mainArea">
    <div id="mainContent" class="welcome">
      <div class="welcome-icon">📖</div>
      <div class="welcome-title">بسم الله الرحمن الرحيم</div>
      <div class="welcome-desc">
        اختر سورة من القائمة على اليمين لتبدأ القراءة.<br>
        يمكنك الاستماع للآيات مباشرة، أو رفع ملفاتك الصوتية الخاصة من جهازك وتشغيلها بدون إنترنت.
      </div>
      <div class="welcome-stats">
        <div class="stat-box"><div class="stat-num">114</div><div class="stat-label">سورة</div></div>
        <div class="stat-box"><div class="stat-num">6236</div><div class="stat-label">آية</div></div>
        <div class="stat-box"><div class="stat-num">30</div><div class="stat-label">جزءاً</div></div>
      </div>
    </div>
    <div class="now-playing" id="nowPlaying">
      <div class="np-controls">
        <button class="np-btn" onclick="prevAyah()" title="السابقة">⏮</button>
        <button class="np-btn main" id="npPlayBtn" onclick="togglePlay()">▶</button>
        <button class="np-btn" onclick="nextAyah()" title="التالية">⏭</button>
      </div>
      <div class="np-info">
        <div class="np-title" id="npTitle">-</div>
        <div class="np-subtitle" id="npSubtitle">-</div>
      </div>
      <div class="np-progress" id="npProgress" onclick="seekAudio(event)">
        <div class="np-progress-fill" id="npFill"></div>
      </div>
      <button class="np-btn" onclick="closePlayer()" title="إغلاق">✕</button>
    </div>
  </main>
</div>

<audio id="audioPlayer" ontimeupdate="updateProgress()" onended="nextAyah()" onplay="onPlay()" onpause="onPause()"></audio>

let currentSura = null;
let currentAyahs = [];
let currentAyahIndex = -1;
let bookmarks = [];
let localAudios = {};

try { bookmarks = JSON.parse(localStorage.getItem('quran_bm') || '[]'); } catch(e) {}

function init() {
  renderSuraList(SURAS);
  renderBookmarks();
}

function renderSuraList(list) {
  document.getElementById('suraList').innerHTML = list.map(s => `
    <div class="sura-item ${currentSura && currentSura.n === s.n ? 'active' : ''}" onclick="loadSura(${s.n})">
      <div class="sura-num">${s.n}</div>
      <div class="sura-info">
        <div class="sura-name">${s.name}</div>
        <div class="sura-meta">${s.en} · ${s.ayat} آية</div>
      </div>
      <div class="sura-type">${s.type}</div>
    </div>`).join('');
}

function filterSuras() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderSuraList(SURAS.filter(s => s.name.includes(q) || s.en.toLowerCase().includes(q) || String(s.n).includes(q)));
}

async function loadSura(n) {
  currentSura = SURAS.find(s => s.n === n);
  currentAyahs = [];
  currentAyahIndex = -1;
  renderSuraList(SURAS.filter(s => s.name.includes(document.getElementById('searchInput').value)));

  const mainArea = document.getElementById('mainArea');
  const nowPlaying = document.getElementById('nowPlaying');

  mainArea.innerHTML = `
    <div id="mainContent">
      <div class="surah-header">
        <div class="surah-title">${currentSura.name}</div>
        <div class="surah-subtitle">${currentSura.en} · صفحة ${currentSura.page}</div>
        ${n !== 9 ? `<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>` : ''}
        <div class="surah-info-bar">
          <div class="info-badge">السورة: <span>${n}</span></div>
          <div class="info-badge">الآيات: <span>${currentSura.ayat}</span></div>
          <div class="info-badge">النوع: <span>${currentSura.type}</span></div>
        </div>
      </div>
      <div class="audio-upload-bar">
        <span>🎵 رفع صوت لهذه السورة:</span>
        <label class="upload-label-global">
          📁 اختر ملفات (سمّها 1.mp3، 2.mp3...)
          <input type="file" accept="audio/*" multiple onchange="handleSuraAudio(event,${n})">
        </label>
      </div>
      <div class="ayat-container" id="ayatContainer">
        <div class="loading"><div class="spinner"></div><span>جارٍ تحميل الآيات...</span></div>
      </div>
    </div>
  `;
  mainArea.appendChild(nowPlaying);

  try {
    const res = await fetch(`https://api.alquran.cloud/v1/surah/${n}/ar.alafasy`);
    if (!res.ok) throw new Error('no audio');
    const data = await res.json();
    currentAyahs = data.data.ayahs;
    renderAyahs(n);
  } catch {
    try {
      const res2 = await fetch(`https://api.alquran.cloud/v1/surah/${n}`);
      if (!res2.ok) throw new Error('no text');
      const data2 = await res2.json();
      currentAyahs = data2.data.ayahs;
      renderAyahs(n);
    } catch {
      document.getElementById('ayatContainer').innerHTML = '<div class="empty-state" style="padding:60px">⚠️ تعذّر تحميل الآيات. تحقق من الاتصال بالإنترنت.</div>';
    }
  }
}

function renderAyahs(suraNum) {
  document.getElementById('ayatContainer').innerHTML = currentAyahs.map((a, i) => {
    const key = `${suraNum}_${a.numberInSurah}`;
    const hasAudio = !!localAudios[key];
    const bm = isBookmarked(suraNum, a.numberInSurah);
    return `<div class="ayah-card" id="ac-${i}">
      <div class="ayah-num">${a.numberInSurah}</div>
      <div class="ayah-content">
        <div class="ayah-text">${a.text}</div>
        <div class="ayah-actions">
          <button class="play-btn" id="pb-${i}" onclick="playAyah(${i})">▶ استمع</button>
          <label class="upload-ayah-btn ${hasAudio?'has-audio':''}" id="ul-${i}">
            ${hasAudio?'✅ صوت مرفوع':'📁 رفع صوت'}
            <input type="file" accept="audio/*" onchange="handleAyahAudio(event,${suraNum},${a.numberInSurah},${i})">
          </label>
          <button class="bookmark-btn ${bm?'saved':''}" id="bk-${i}" onclick="toggleBookmark(${suraNum},${a.numberInSurah},${i},this)">
            ${bm?'★':'☆'}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function handleAyahAudio(e, sura, ayah, idx) {
  const f = e.target.files[0]; if (!f) return;
  localAudios[`${sura}_${ayah}`] = URL.createObjectURL(f);
  const lbl = document.getElementById(`ul-${idx}`);
  if (lbl) { lbl.className = 'upload-ayah-btn has-audio'; lbl.childNodes[0].nodeValue = '✅ صوت مرفوع'; }
  showToast('✅ تم رفع الصوت للآية ' + ayah);
}

function handleSuraAudio(e, sura) {
  let count = 0;
  Array.from(e.target.files).forEach(f => {
    const m = f.name.match(/(\d+)/);
    if (m) {
      const ayah = parseInt(m[1]);
      localAudios[`${sura}_${ayah}`] = URL.createObjectURL(f);
      const idx = currentAyahs.findIndex(a => a.numberInSurah === ayah);
      if (idx >= 0) {
        const lbl = document.getElementById(`ul-${idx}`);
        if (lbl) { lbl.className = 'upload-ayah-btn has-audio'; lbl.childNodes[0].nodeValue = '✅ صوت مرفوع'; }
      }
      count++;
    }
  });
  showToast(`✅ تم رفع ${count} ملف صوتي بنجاح`);
}

function handleGlobalAudio(e) {
  let count = 0;
  Array.from(e.target.files).forEach(f => {
    const m = f.name.match(/(\d+)/); if (m) { localAudios[`global_${m[1]}`] = URL.createObjectURL(f); count++; }
  });
  showToast(`✅ تم رفع ${count} ملف صوتي`);
}

function playAyah(idx) {
  if (!currentAyahs.length) return;
  const a = currentAyahs[idx];
  const key = `${currentSura.n}_${a.numberInSurah}`;
  const audio = document.getElementById('audioPlayer');
  audio.pause();
  document.querySelectorAll('.ayah-card.playing').forEach(c => c.classList.remove('playing'));
  document.querySelectorAll('.play-btn.active').forEach(b => { b.classList.remove('active'); b.textContent = '▶ استمع'; });

  currentAyahIndex = idx;
  let src = localAudios[key] || (a.audio ? a.audio : null);
  if (!src) {
    showToast('⚠️ لا يوجد صوت. ارفع ملفاً أو تحقق من الاتصال.');
    return;
  }

  audio.src = src;
  audio.play().then(() => {
    const card = document.getElementById(`ac-${idx}`);
    const btn = document.getElementById(`pb-${idx}`);
    if (card) { card.classList.add('playing'); card.scrollIntoView({behavior:'smooth',block:'center'}); }
    if (btn) { btn.classList.add('active'); btn.textContent = '⏸ إيقاف'; }
    document.getElementById('nowPlaying').classList.add('visible');
    document.getElementById('npTitle').textContent = `${currentSura.name} - آية ${a.numberInSurah}`;
    document.getElementById('npSubtitle').textContent = a.text.substring(0, 55) + '...';
    document.getElementById('npPlayBtn').textContent = '⏸';
  }).catch(() => showToast('⚠️ فشل تشغيل الصوت. ارفع ملفاً بدلاً من ذلك.'));
}

function togglePlay() {
  const a = document.getElementById('audioPlayer');
  a.paused ? a.play() : a.pause();
}
function onPlay() { document.getElementById('npPlayBtn').textContent = '⏸'; const b=document.getElementById(`pb-${currentAyahIndex}`); if(b){b.classList.add('active');b.textContent='⏸ إيقاف';} }
function onPause() { document.getElementById('npPlayBtn').textContent = '▶'; const b=document.getElementById(`pb-${currentAyahIndex}`); if(b){b.classList.remove('active');b.textContent='▶ استمع';} }
function nextAyah() { if(currentAyahIndex < currentAyahs.length-1) playAyah(currentAyahIndex+1); }
function prevAyah() { if(currentAyahIndex > 0) playAyah(currentAyahIndex-1); }
function updateProgress() { const a=document.getElementById('audioPlayer'); if(!a.duration) return; document.getElementById('npFill').style.width = (a.currentTime/a.duration*100)+'%'; }
function seekAudio(e) { const a=document.getElementById('audioPlayer'); const b=document.getElementById('npProgress'); a.currentTime = (e.offsetX/b.offsetWidth)*a.duration; }
function closePlayer() { document.getElementById('audioPlayer').pause(); document.getElementById('nowPlaying').classList.remove('visible'); document.querySelectorAll('.ayah-card.playing').forEach(c=>c.classList.remove('playing')); document.querySelectorAll('.play-btn.active').forEach(b=>{b.classList.remove('active');b.textContent='▶ استمع';}); }

function isBookmarked(s, a) { return bookmarks.some(b => b.s===s && b.a===a); }
function toggleBookmark(sura, ayah, idx, btn) {
  const i = bookmarks.findIndex(b => b.s===sura && b.a===ayah);
  if (i >= 0) { bookmarks.splice(i,1); btn.classList.remove('saved'); btn.textContent='☆'; }
  else { const a=currentAyahs[idx]; bookmarks.push({s:sura,a:ayah,name:currentSura.name,text:a.text.substring(0,60)}); btn.classList.add('saved'); btn.textContent='★'; }
  try { localStorage.setItem('quran_bm', JSON.stringify(bookmarks)); } catch(e){}
  renderBookmarks();
}
function renderBookmarks() {
  const el = document.getElementById('bookmarksList');
  if (!bookmarks.length) { el.innerHTML='<div class="empty-state">لا توجد آيات محفوظة بعد</div>'; return; }
  el.innerHTML = bookmarks.map(b=>`<div class="bp-item" onclick="loadSura(${b.s})"><div class="bp-item-title">${b.name} - آية ${b.a}</div><div class="bp-item-text">${b.text}</div></div>`).join('');
}
function toggleBookmarks() { document.getElementById('bookmarksPanel').classList.toggle('open'); }

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

init();
</script>
